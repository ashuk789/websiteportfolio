<!DOCTYPE html>
<html>
    <head>
    <title>Header</title>
    <Style>
        body{
            margin: 0;
            font-family: Arial;
            background-color: #d63384;
            color: white;
        }
        .header{
            height: 90px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            gap: 25px;
        }
        .top{
            width: 180px;
        }
        .top h1{
            margin: 0;
            font-family: 28px;
        }
        .top p{
            margin: 2px 0;
            font-family: 12px;
        }
        .search {
            flex: 1;
        }
        .search input{
            width: 40%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .login-button{
            background-color: white;
            color: #d63384;
            padding: 12px 25px ;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }
        .cart-button{
            background-color: white;
            color: #d63384;
            padding: 12px 25px;
            border-radius: 4px;
            text-decoration: none;
            font-weight:bold ;
        }
        button{
            background-color: white;
            color: #d63384;
            padding: 12px 25px;
            border-radius: 4px;
            text-decoration: none;
            font-weight:bold ;
        }
    </Style>
    </head>
    <body>
        <div class="header">
            <img src="logo.png" height="90" width="90">
            <div class="=top">
                <h1>GLAWORA</h1>
                <P>Beauty and Personl Care</P>
            </div>
            <div class="search">
                <input typr="text" placeholder=" 🔍Search for beauty product">
                <button>Search</button>
            </div>
            <a href="loginfile.html" target="content" class="login-button">Login</a>
            <a href="cart.html" target="content" class="cart-button">Cart 🛒</a>
        </div>
    </body>
</html>
