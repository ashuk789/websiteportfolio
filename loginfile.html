<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
 font-family:Arial;
 background:#fff0f5;
}

.login{
 width:350px;
 margin:70px auto;
 padding:30px;
 background:white;
 text-align:center;
 border-radius:10px;
 box-shadow:0 2px 8px #ccc;
}

h1{
 color:#d63384;
}

input{
 width:90%;
 padding:10px;
 margin:10px;
 border:1px solid #ccc;
}

button{
 background:#d63384;
 color:white;
 border:0;
 padding:10px 25px;
 border-radius:5px;
}
</style>
</head>

<body>

<div class="login">

<h1>🔐 Login</h1>

<form action="home.html">

<input type="text" placeholder="Enter Username">

<br>

<input type="email" placeholder="Enter Email">

<br>

<input type="password" placeholder="Enter Password">

<br><br>

<button>Login</button>

<button type="reset">Reset</button>

</form>

</div>

</body>
</html>
