<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glowish - Shopping Cart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f8;
            color: #333;
        }

        header {
            background: #c94f72;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .page-title {
            color: #c94f72;
            margin-bottom: 25px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .cart-items,
        .summary {
            background: white;
            padding: 22px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ddd;
        }

        .cart-item {
            display: flex;
            gap: 18px;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:first-child {
            padding-top: 0;
        }

        .product-image {
            width: 120px;
            height: 130px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-info h3 {
            margin: 5px 0 10px;
            overflow-wrap: anywhere;
        }

        .price {
            color: #c94f72;
            font-weight: bold;
            font-size: 19px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 15px 0;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity button:hover {
            background: #fff0f5;
            border-color: #c94f72;
        }

        .quantity button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #c94f72;
            cursor: pointer;
            font-weight: bold;
            padding: 5px 0;
        }

        .summary h2 {
            color: #c94f72;
            font-size: 20px;
            margin-top: 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 20px 0;
        }

        .total {
            border-top: 1px dashed #ccc;
            padding-top: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .total span:last-child {
            color: #c94f72;
        }

        .free {
            color: #388e3c;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .checkout-btn {
            background: #c94f72;
            color: white;
        }

        .checkout-btn:hover {
            background: #ad365a;
        }

        .continue-btn {
            background: #fff0f5;
            color: #c94f72;
        }

        .empty-cart {
            background: white;
            padding: 50px 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px #ddd;
        }

        .empty-cart h2 {
            color: #c94f72;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .empty-cart a {
            display: inline-block;
            background: #c94f72;
            color: white;
            padding: 13px 22px;
            border-radius: 5px;
            text-decoration: none;
        }

        .note {
            color: #777;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 18px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 750px) {
            header {
                padding: 16px 5%;
                gap: 12px;
            }

            header h1 {
                font-size: 22px;
            }

            header a {
                font-size: 13px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                gap: 12px;
            }

            .product-image {
                width: 95px;
                height: 110px;
            }

            .cart-items,
            .summary {
                padding: 16px;
            }
        }

        @media (max-width: 380px) {
            .product-image {
                width: 75px;
                height: 90px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🌸 GLOWISH</h1>
        <a href="product.html">← Continue Shopping</a>
    </header>

    <div class="container">
        <h2 class="page-title">🛒 My Shopping Cart</h2>

        <div id="cartContent"></div>
    </div>

    <footer>
        © 2026 Glowish Beauty Store |
        Thank you for shopping with us 💗
    </footer>

    <script>
        "use strict";

        const cartContent = document.getElementById("cartContent");

        let cart = [];

        function formatPrice(amount) {
            return amount.toLocaleString("en-IN", {
                style: "currency",
                currency: "INR",
                maximumFractionDigits: 2
            });
        }

        function getPrice(value) {
            if (typeof value === "number") {
                return value;
            }

            if (typeof value !== "string") {
                return NaN;
            }

            const cleaned = value.replace(/[₹,\s]/g, "");

            return /^\d+(\.\d{1,2})?$/.test(cleaned)
                ? Number(cleaned)
                : NaN;
        }

        function saveCart() {
            try {
                localStorage.setItem("cart", JSON.stringify(cart));
                return true;
            } catch (error) {
                alert("Unable to save your cart. Please try again.");
                return false;
            }
        }

        function loadCart() {
            try {
                const savedCart = JSON.parse(
                    localStorage.getItem("cart") || "[]"
                );

                if (!Array.isArray(savedCart)) {
                    cart = [];
                    return;
                }

                cart = savedCart.filter(function (item) {
                    return item &&
                        typeof item.name === "string" &&
                        item.name.trim() !== "" &&
                        typeof item.image === "string" &&
                        item.image.trim() !== "" &&
                        Number.isInteger(item.quantity) &&
                        item.quantity >= 1 &&
                        item.quantity <= 99 &&
                        Number.isFinite(getPrice(item.price)) &&
                        getPrice(item.price) > 0;
                });

                if (cart.length !== savedCart.length) {
                    localStorage.setItem("cart", JSON.stringify(cart));
                }
            } catch (error) {
                cart = [];
            }
        }

        function renderCart() {
            if (cart.length === 0) {
                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your Cart Is Empty! 🛍️</h2>

                        <p>
                            You haven't added any beauty products
                            to your cart yet.
                        </p>

                        <a href="product.html">Explore Products</a>
                    </div>
                `;
                return;
            }

            let itemsHTML = "";
            let subtotal = 0;

            cart.forEach(function (item, index) {
                const price = getPrice(item.price);
                const itemTotal = price * item.quantity;

                subtotal += itemTotal;

                itemsHTML += `
                    <div class="cart-item">

                        <img
                            class="product-image"
                            src="${escapeAttribute(item.image)}"
                            alt=""
                        >

                        <div class="product-info">

                            <h3>${escapeHTML(item.name)}</h3>

                            <p class="price">
                                ${formatPrice(price)}
                            </p>

                            <div class="quantity">
                                <button
                                    type="button"
                                    onclick="changeQuantity(${index}, -1)"
                                    aria-label="Decrease quantity"
                                    ${item.quantity <= 1 ? "disabled" : ""}
                                >−</button>

                                <span>${item.quantity}</span>

                                <button
                                    type="button"
                                    onclick="changeQuantity(${index}, 1)"
                                    aria-label="Increase quantity"
                                    ${item.quantity >= 99 ? "disabled" : ""}
                                >+</button>
                            </div>

                            <p>
                                Item Total:
                                <strong>${formatPrice(itemTotal)}</strong>
                            </p>

                            <button
                                type="button"
                                class="remove-btn"
                                onclick="removeItem(${index})"
                            >
                                🗑 Remove
                            </button>

                        </div>
                    </div>
                `;
            });

            cartContent.innerHTML = `
                <div class="cart-layout">

                    <div class="cart-items">
                        ${itemsHTML}
                    </div>

                    <div class="summary">

                        <h2>PRICE DETAILS</h2>

                        <div class="summary-row">
                            <span>Total Items</span>
                            <span>${cart.reduce(
                                (sum, item) => sum + item.quantity, 0
                            )}</span>
                        </div>

                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>${formatPrice(subtotal)}</span>
                        </div>

                        <div class="summary-row">
                            <span>Delivery Charges</span>
                            <span class="free">FREE</span>
                        </div>

                        <div class="summary-row total">
                            <span>Total Amount</span>
                            <span>${formatPrice(subtotal)}</span>
                        </div>

                        <button
                            type="button"
                            class="btn checkout-btn"
                            onclick="checkout()"
                        >
                            PROCEED TO CHECKOUT
                        </button>

                        <a href="product.html" class="btn continue-btn">
                            CONTINUE SHOPPING
                        </a>

                        <p class="note">
                            Free delivery on all orders.
                            Review your cart before proceeding to checkout.
                        </p>

                    </div>
                </div>
            `;
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, function (char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }

        function escapeAttribute(value) {
            return escapeHTML(value);
        }

        function changeQuantity(index, change) {
            if (!cart[index]) {
                return;
            }

            const newQuantity = cart[index].quantity + change;

            if (newQuantity < 1 || newQuantity > 99) {
                return;
            }

            cart[index].quantity = newQuantity;

            if (saveCart()) {
                renderCart();
            }
        }

        function removeItem(index) {
            if (!cart[index]) {
                return;
            }

            const productName = cart[index].name;

            if (confirm("Remove " + productName + " from your cart?")) {
                cart.splice(index, 1);

                if (saveCart()) {
                    renderCart();
                }
            }
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            /*
              Your current buy.html accepts one product through
              localStorage key "buyProduct".

              Therefore, checkout sends the first cart item to
              buy.html. Other cart items remain saved in the cart.
            */

            const product = cart[0];

            try {
                localStorage.setItem(
                    "buyProduct",
                    JSON.stringify({
                        name: product.name,
                        price: product.price,
                        image: product.image
                    })
                );

                window.location.href = "buy.html";
            } catch (error) {
                alert("Unable to proceed to checkout. Please try again.");
            }
        }

        loadCart();
        renderCart();
    </script>

</body>
</html>
```
