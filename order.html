```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glowish - Order Confirmation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #212121;
        }

        header {
            background: #c94f72;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px #ccc;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 15px;
        }

        .success-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ddd;
            margin-bottom: 20px;
        }

        .success {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            background: #e8f5e9;
            color: #388e3c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 15px;
        }

        .success h2 {
            color: #388e3c;
            margin-bottom: 10px;
        }

        .success p {
            color: #666;
            line-height: 1.6;
        }

        .section-title {
            color: #c94f72;
            font-size: 18px;
            margin: 25px 0 20px;
        }

        .product-details {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .product-image {
            width: 130px;
            height: 140px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .product-info {
            overflow-wrap: anywhere;
        }

        .product-info h3 {
            margin-top: 0;
        }

        .price {
            color: #c94f72;
            font-size: 22px;
            font-weight: bold;
        }

        .details-box {
            background: #fafafa;
            padding: 18px;
            border-radius: 5px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 15px 0;
        }

        .total {
            border-top: 1px dashed #ccc;
            padding-top: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .total span:last-child {
            color: #c94f72;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .primary-btn {
            background: #c94f72;
            color: white;
        }

        .secondary-btn {
            background: #fff0f5;
            color: #c94f72;
        }

        .empty {
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                padding: 16px 5%;
                gap: 10px;
            }

            header h1 {
                font-size: 21px;
            }

            header a {
                font-size: 13px;
            }

            .success-card {
                padding: 20px;
            }

            .product-image {
                width: 100px;
                height: 120px;
            }

            .product-details {
                gap: 12px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🌸 GLOWISH</h1>
        <a href="index.html">Continue Shopping</a>
    </header>

    <div class="container" id="orderContent">

        <div class="success-card empty">
            <h2>Loading your order...</h2>
        </div>

    </div>

    <footer>
        © 2026 Glowish Beauty Store |
        Thank you for shopping with us 💗
    </footer>

    <script>
        "use strict";

        const orderContent = document.getElementById("orderContent");

        function formatPrice(amount) {
            return amount.toLocaleString("en-IN", {
                style: "currency",
                currency: "INR",
                maximumFractionDigits: 2
            });
        }

        function showError() {
            orderContent.innerHTML = `
                <div class="success-card empty">
                    <h2>Order Not Found!</h2>
                    <p>
                        We couldn't find your order details.
                        Please select a product and try again.
                    </p>
                    <a href="index.html" class="btn primary-btn">
                        Go Shopping
                    </a>
                </div>
            `;
        }

        function showOrder(order) {
            const product = order.product;
            const customer = order.customer;

            if (
                !product ||
                typeof product.name !== "string" ||
                !product.name.trim() ||
                typeof product.image !== "string" ||
                !product.image ||
                !customer ||
                typeof customer.name !== "string" ||
                typeof customer.mobile !== "string" ||
                typeof customer.pincode !== "string" ||
                typeof customer.address !== "string" ||
                !Number.isInteger(order.quantity) ||
                order.quantity < 1 ||
                order.quantity > 99 ||
                typeof order.total !== "number" ||
                !Number.isFinite(order.total) ||
                order.total <= 0
            ) {
                showError();
                return;
            }

            const total = order.total;
            const unitPrice = total / order.quantity;
            const orderDate = order.orderDate
                ? new Date(order.orderDate)
                : null;

            const dateText =
                orderDate && !Number.isNaN(orderDate.getTime())
                    ? orderDate.toLocaleString("en-IN")
                    : "Not available";

            // Use textContent for customer-supplied text.
            orderContent.innerHTML = `
                <div class="success-card">

                    <div class="success">
                        <div class="success-icon">✓</div>

                        <h2>Order Placed Successfully!</h2>

                        <p>
                            Thank you for shopping with Glowish! 💗
                            Your order details are shown below.
                        </p>

                        <p>
                            <strong>Order Date:</strong>
                            <span id="orderDate"></span>
                        </p>
                    </div>

                    <h3 class="section-title">
                        📦 PRODUCT DETAILS
                    </h3>

                    <div class="product-details">

                        <img
                            id="productImage"
                            class="product-image"
                            alt="Ordered product"
                        >

                        <div class="product-info">
                            <h3 id="productName"></h3>

                            <p>
                                Quantity:
                                <strong id="productQuantity"></strong>
                            </p>

                            <p>
                                Unit Price:
                                <strong id="unitPrice"></strong>
                            </p>

                            <p class="price" id="productTotal"></p>
                        </div>

                    </div>

                    <h3 class="section-title">
                        🚚 DELIVERY ADDRESS
                    </h3>

                    <div class="details-box">
                        <strong>Name:</strong>
                        <span id="customerName"></span>
                        <br>

                        <strong>Mobile:</strong>
                        <span id="customerMobile"></span>
                        <br>

                        <strong>PIN Code:</strong>
                        <span id="customerPincode"></span>
                        <br>

                        <strong>Address:</strong>
                        <span id="customerAddress"></span>
                    </div>

                    <h3 class="section-title">
                        💰 PRICE SUMMARY
                    </h3>

                    <div class="price-row">
                        <span>Product Price</span>
                        <span id="summarySubtotal"></span>
                    </div>

                    <div class="price-row">
                        <span>Delivery Charges</span>
                        <span style="color:#388e3c">FREE</span>
                    </div>

                    <div class="price-row total">
                        <span>Total Amount</span>
                        <span id="summaryTotal"></span>
                    </div>

                    <div class="buttons">
                        <a href="index.html" class="btn primary-btn">
                            CONTINUE SHOPPING
                        </a>

                        <button
                            type="button"
                            class="btn secondary-btn"
                            id="printBtn"
                        >
                            PRINT ORDER
                        </button>
                    </div>

                </div>
            `;

            document.getElementById("orderDate").textContent =
                dateText;

            document.getElementById("productImage").src =
                product.image;

            document.getElementById("productImage").alt =
                product.name;

            document.getElementById("productName").textContent =
                product.name;

            document.getElementById("productQuantity").textContent =
                order.quantity;

            document.getElementById("unitPrice").textContent =
                formatPrice(unitPrice);

            document.getElementById("productTotal").textContent =
                formatPrice(total);

            document.getElementById("customerName").textContent =
                customer.name;

            document.getElementById("customerMobile").textContent =
                customer.mobile;

            document.getElementById("customerPincode").textContent =
                customer.pincode;

            document.getElementById("customerAddress").textContent =
                customer.address;

            document.getElementById("summarySubtotal").textContent =
                formatPrice(total);

            document.getElementById("summaryTotal").textContent =
                formatPrice(total);

            document.getElementById("printBtn").addEventListener(
                "click",
                function () {
                    window.print();
                }
            );
        }

        try {
            const savedOrder = JSON.parse(
                localStorage.getItem("glowishOrder") || "null"
            );

            if (savedOrder) {
                showOrder(savedOrder);
            } else {
                showError();
            }
        } catch (error) {
            showError();
        }
    </script>

</body>
</html>
